<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181a" />
      <stop offset="100%" stop-color="#0e0e0f" />
    </linearGradient>
    <linearGradient id="greenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1DB954" />
      <stop offset="100%" stop-color="#1ed760" />
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)" />
  <circle cx="200" cy="200" r="120" stroke="#2a2a2c" stroke-width="4" fill="none" opacity="0.4" />
  <circle cx="200" cy="200" r="80" stroke="#2a2a2c" stroke-width="3" fill="none" opacity="0.6" />
  <circle cx="200" cy="200" r="40" fill="#121214" stroke="#1DB954" stroke-width="2" />
  <!-- Vinyl record center hole -->
  <circle cx="200" cy="200" r="8" fill="#1DB954" />
  <!-- Radio wave soundbars -->
  <rect x="130" y="270" width="10" height="30" rx="5" fill="url(#greenGlow)" opacity="0.8" />
  <rect x="150" y="250" width="10" height="50" rx="5" fill="url(#greenGlow)" opacity="0.8" />
  <rect x="170" y="240" width="10" height="60" rx="5" fill="url(#greenGlow)" opacity="0.9" />
  <rect x="190" y="230" width="10" height="70" rx="5" fill="url(#greenGlow)" />
  <rect x="210" y="235" width="10" height="65" rx="5" fill="url(#greenGlow)" />
  <rect x="230" y="245" width="10" height="55" rx="5" fill="url(#greenGlow)" opacity="0.9" />
  <rect x="250" y="260" width="10" height="40" rx="5" fill="url(#greenGlow)" opacity="0.8" />
</svg>
